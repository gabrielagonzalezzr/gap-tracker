<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School meals gap tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F7F5EE; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/prop-types/prop-types.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts/umd/Recharts.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const {
  BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Cell, ReferenceLine, ResponsiveContainer,
} = Recharts;

const storage = {
  async get(key) {
    const v = window.localStorage.getItem(key);
    return v === null ? null : { value: v };
  },
  async set(key, value) {
    window.localStorage.setItem(key, value);
    return { value };
  },
};

const INK = "#17160F";
const PAPER = "#F7F5EE";
const PAPER_ALT = "#EEE9D8";
const MUTED = "#6E6C61";
const GREEN = "#34633F";
const MUSTARD = "#B8860B";
const BRICK = "#A23E2C";

const stateGrowth = [
  { state: "Vermont", code: "VT", growth: 85, policy: "universal", note: "Permanent universal free meals since 2023" },
  { state: "Maine", code: "ME", growth: 82, policy: "universal", note: "Permanent universal free meals since 2022" },
  { state: "Colorado", code: "CO", growth: 79, policy: "universal", note: "Permanent universal free meals since 2023" },
  { state: "South Dakota", code: "SD", growth: 7, policy: "means-tested", note: "No statewide universal policy" },
  { state: "Utah", code: "UT", growth: 4, policy: "means-tested", note: "No statewide universal policy" },
  { state: "Tennessee", code: "TN", growth: 1, policy: "means-tested", note: "No statewide universal policy" },
];

const policyColor = { universal: GREEN, "means-tested": BRICK };

function CustomTooltip({ active, payload }) {
  if (!active || !payload || !payload.length) return null;
  const d = payload[0].payload;
  return (
    <div style={{ background: PAPER, border: `1.5px solid ${INK}`, padding: "10px 14px", fontFamily: "'Archivo', sans-serif", maxWidth: 220 }}>
      <div style={{ fontWeight: 900, fontSize: 13, color: INK }}>{d.state}</div>
      <div style={{ fontSize: 20, fontWeight: 900, color: policyColor[d.policy], fontVariantNumeric: "tabular-nums" }}>+{d.growth}%</div>
      <div style={{ fontSize: 11, color: MUTED, marginTop: 2, lineHeight: 1.4 }}>participation growth since FY2020</div>
      <div style={{ fontSize: 11, color: INK, marginTop: 6, borderTop: `1px solid ${PAPER_ALT}`, paddingTop: 6 }}>{d.note}</div>
    </div>
  );
}

const DEFAULT_WEIGHTS = { adoption: 40, effect: 30, evidence: 15, friction: 15 };
const SCORE_INPUTS = { adoption: 84, effect: 95, evidence: 100, friction: 85 };

function scoreLabel(score) {
  if (score >= 75) return { text: "Severe gap", color: BRICK };
  if (score >= 50) return { text: "High gap", color: MUSTARD };
  if (score >= 25) return { text: "Moderate gap", color: "#7A6A2E" };
  return { text: "Low gap", color: GREEN };
}

function SchoolMealsGapTracker() {
  const [tab, setTab] = useState("growth");
  const [weights, setWeights] = useState(DEFAULT_WEIGHTS);
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState("idle");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const result = await storage.get("schoolmeals-weights");
        if (!cancelled && result && result.value) {
          const parsed = JSON.parse(result.value);
          setWeights({ ...DEFAULT_WEIGHTS, ...parsed });
        }
      } catch (e) {
      } finally {
        if (!cancelled) setLoaded(true);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  async function updateWeight(key, value) {
    const next = { ...weights, [key]: value };
    setWeights(next);
    setSaveState("saving");
    try {
      await storage.set("schoolmeals-weights", JSON.stringify(next));
      setSaveState("saved");
    } catch (e) {
      setSaveState("error");
    }
  }

  const weightSum = weights.adoption + weights.effect + weights.evidence + weights.friction || 1;
  const rawScore = (SCORE_INPUTS.adoption * weights.adoption + SCORE_INPUTS.effect * weights.effect + SCORE_INPUTS.evidence * weights.evidence + SCORE_INPUTS.friction * weights.friction) / weightSum;
  const score = Math.round(rawScore);
  const label = scoreLabel(score);

  return (
    <div style={{ background: PAPER, color: INK, fontFamily: "'Source Serif 4', Georgia, serif", maxWidth: 860, margin: "0 auto", padding: "0 0 48px" }}>
      <style>{`
        .eyebrow { font-family:'Archivo',sans-serif; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; font-size:11px; color:${MUTED}; }
        .num { font-family:'Archivo',sans-serif; font-variant-numeric:tabular-nums; }
        .tabbtn { font-family:'Archivo',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; background:none; border:none; cursor:pointer; padding:10px 0; border-bottom:3px solid transparent; color:${MUTED}; }
        .tabbtn.active { color:${INK}; border-bottom:3px solid ${INK}; }
      `}</style>

      <div style={{ padding: "36px 32px 0" }}>
        <div className="eyebrow">Persistent impact tracker — case study 01 of many</div>
        <h1 style={{ fontFamily: "'Archivo', sans-serif", fontWeight: 900, fontSize: 34, lineHeight: 1.08, margin: "10px 0 12px", letterSpacing: "-0.01em" }}>
          School meals: what the research predicts,<br />what states actually deliver
        </h1>
        <p style={{ fontSize: 16, color: MUTED, maxWidth: 620, margin: 0, lineHeight: 1.6 }}>
          The National School Lunch Program is the first case study for tracking the gap between published intervention research and real-world implementation, read through a behavioral-economics lens.
        </p>
      </div>

      <div style={{ height: 6, background: INK, margin: "24px 0 0" }} />
      <div style={{ height: 1, background: INK, marginBottom: 22 }} />

      <div style={{ padding: "0 32px", display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 0 }}>
        {[
          { label: "Theory", body: "Removing income-based sorting and paperwork should raise take-up among eligible kids, without changing who is eligible." },
          { label: "Practice", body: "States that made meals free for everyone saw real gains: Vermont, Maine and Colorado grew participation 79–85% since 2020." },
          { label: "The gap", body: "Comparable means-tested states grew only 1–7% in the same period. Only 8 states have made universal meals permanent." },
        ].map((c, i) => (
          <div key={c.label} style={{ padding: "0 20px 20px", borderLeft: i > 0 ? `1px solid ${PAPER_ALT}` : "none" }}>
            <div className="eyebrow" style={{ marginBottom: 8 }}>{c.label}</div>
            <div style={{ fontSize: 14.5, lineHeight: 1.55 }}>{c.body}</div>
          </div>
        ))}
      </div>

      <div style={{ height: 1, background: INK, margin: "4px 32px 28px" }} />

      <div style={{ padding: "0 32px", marginBottom: 30 }}>
        <div className="eyebrow" style={{ marginBottom: 10 }}>Gap severity score</div>
        <div style={{ display: "flex", gap: 28, alignItems: "flex-start", flexWrap: "wrap" }}>
          <div style={{ minWidth: 130 }}>
            <div className="num" style={{ fontSize: 56, fontWeight: 900, color: label.color, lineHeight: 1 }}>{score}</div>
            <div style={{ fontFamily: "Archivo", fontWeight: 800, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.06em", color: label.color, marginTop: 6 }}>{label.text}</div>
            <div style={{ fontSize: 11.5, color: MUTED, marginTop: 6 }}>out of 100</div>
          </div>
          <div style={{ flex: 1, minWidth: 260 }}>
            {[
              { key: "adoption", label: "Adoption gap", value: SCORE_INPUTS.adoption },
              { key: "effect", label: "Effect magnitude", value: SCORE_INPUTS.effect },
              { key: "evidence", label: "Evidence age", value: SCORE_INPUTS.evidence },
              { key: "friction", label: "Friction clarity", value: SCORE_INPUTS.friction },
            ].map((row) => (
              <div key={row.key} style={{ marginBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 3 }}>
                  <span style={{ fontFamily: "Archivo", fontWeight: 700 }}>{row.label}</span>
                  <span style={{ color: MUTED }}>input {row.value} · weight {weights[row.key]}%</span>
                </div>
                <input type="range" min="0" max="60" step="1" value={weights[row.key]} onChange={(e) => updateWeight(row.key, Number(e.target.value))} style={{ width: "100%" }} />
              </div>
            ))}
            <div style={{ fontSize: 11, color: MUTED, marginTop: 4 }}>
              {loaded ? (saveState === "saving" ? "Saving your weighting…" : "Weights are saved in this browser and will be here next time you open this.") : "Loading saved weights…"}
            </div>
          </div>
        </div>
      </div>

      <div style={{ height: 1, background: INK, margin: "0 32px 28px" }} />

      <div style={{ padding: "0 32px" }}>
        <div style={{ display: "flex", gap: 24, marginBottom: 18 }}>
          <button className={`tabbtn ${tab === "growth" ? "active" : ""}`} onClick={() => setTab("growth")}>State growth since 2020</button>
          <button className={`tabbtn ${tab === "friction" ? "active" : ""}`} onClick={() => setTab("friction")}>The friction, quantified</button>
        </div>

        {tab === "growth" && (
          <div>
            <div style={{ display: "flex", gap: 18, marginBottom: 14, fontFamily: "'Archivo', sans-serif", fontSize: 12 }}>
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 11, height: 11, background: GREEN, display: "inline-block" }} />Universal free meals</span>
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 11, height: 11, background: BRICK, display: "inline-block" }} />Means-tested (status quo)</span>
            </div>
            <div style={{ height: 300 }}>
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={stateGrowth} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                  <CartesianGrid vertical={false} stroke={PAPER_ALT} />
                  <XAxis dataKey="code" tick={{ fontFamily: "Archivo", fontSize: 12, fill: INK, fontWeight: 700 }} axisLine={{ stroke: INK }} tickLine={false} />
                  <YAxis tickFormatter={(v) => `${v}%`} tick={{ fontFamily: "Archivo", fontSize: 11, fill: MUTED }} axisLine={false} tickLine={false} width={40} />
                  <Tooltip content={<CustomTooltip />} cursor={{ fill: PAPER_ALT }} />
                  <ReferenceLine y={33} stroke={MUSTARD} strokeDasharray="4 3" strokeWidth={1.5} label={{ value: "US average +33%", position: "insideTopRight", fill: MUSTARD, fontFamily: "Archivo", fontSize: 11, fontWeight: 700 }} />
                  <Bar dataKey="growth" radius={[3, 3, 0, 0]} maxBarSize={56}>
                    {stateGrowth.map((d) => (<Cell key={d.code} fill={policyColor[d.policy]} />))}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>
            <p style={{ fontSize: 12.5, color: MUTED, marginTop: 10, lineHeight: 1.5 }}>
              Only the six states with sourced FY2020–FY2024 growth figures are shown. Other states are not yet in this dataset — flagged here deliberately rather than estimated, since an honest gap in the data is more useful than a filled-in guess.
            </p>
          </div>
        )}

        {tab === "friction" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 18 }}>
              <div style={{ background: PAPER_ALT, padding: "18px 20px" }}>
                <div className="num" style={{ fontSize: 40, fontWeight: 900, color: BRICK, lineHeight: 1 }}>20%</div>
                <div style={{ fontSize: 13, marginTop: 8, lineHeight: 1.5 }}>of parents whose children are eligible for free or reduced-price meals but don't participate cite stigma as the reason.</div>
              </div>
              <div style={{ background: PAPER_ALT, padding: "18px 20px" }}>
                <div className="num" style={{ fontSize: 40, fontWeight: 900, color: GREEN, lineHeight: 1 }}>60%</div>
                <div style={{ fontSize: 13, marginTop: 8, lineHeight: 1.5 }}>of NSLP schools now operate some universal-meal option, mostly through automatic eligibility instead of an application.</div>
              </div>
            </div>
            <div style={{ borderLeft: `3px solid ${MUSTARD}`, paddingLeft: 16, marginBottom: 22 }}>
              <div className="eyebrow" style={{ marginBottom: 6 }}>Mechanism</div>
              <p style={{ fontSize: 14.5, lineHeight: 1.6, margin: 0 }}>
                Students who report feeling embarrassed about eating school lunch are significantly less likely to participate, an effect concentrated among lower-income households — the exact group the program is meant to reach. The barrier isn't information about nutrition. It's the social and administrative cost of accessing the benefit: paperwork, visible separate lines, and identity exposure. That reframes the fix from "explain the benefit better" to "remove the friction structurally."
              </p>
            </div>
            <div>
              <div className="eyebrow" style={{ marginBottom: 8 }}>Two structural fixes, same target</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                <div style={{ padding: "14px 16px", border: `1px solid ${PAPER_ALT}` }}>
                  <div style={{ fontFamily: "Archivo", fontWeight: 800, fontSize: 13, marginBottom: 4 }}>Direct certification</div>
                  <div style={{ fontSize: 13, color: MUTED, lineHeight: 1.5 }}>Cross-references SNAP and Medicaid data to auto-enroll eligible students, no application required.</div>
                </div>
                <div style={{ padding: "14px 16px", border: `1px solid ${PAPER_ALT}` }}>
                  <div style={{ fontFamily: "Archivo", fontWeight: 800, fontSize: 13, marginBottom: 4 }}>Universal free meals</div>
                  <div style={{ fontSize: 13, color: MUTED, lineHeight: 1.5 }}>Removes income-based sorting entirely, so no student's meal status is ever visible to peers.</div>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>

      <div style={{ height: 1, background: INK, margin: "32px 32px 20px" }} />

      <div style={{ padding: "0 32px" }}>
        <div className="eyebrow" style={{ marginBottom: 10 }}>Five-state before / after, 2018–19 vs 2022–23</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 16, marginBottom: 22 }}>
          <div><div className="num" style={{ fontSize: 30, fontWeight: 900 }}>+6%</div><div style={{ fontSize: 12.5, color: MUTED, marginTop: 4 }}>overall meal participation across CA, ME, MA, NV, VT</div></div>
          <div><div className="num" style={{ fontSize: 30, fontWeight: 900 }}>+233,656</div><div style={{ fontSize: 12.5, color: MUTED, marginTop: 4 }}>more students served lunch</div></div>
          <div><div className="num" style={{ fontSize: 30, fontWeight: 900 }}>+129,264</div><div style={{ fontSize: 12.5, color: MUTED, marginTop: 4 }}>more students served breakfast</div></div>
        </div>
        <div className="eyebrow" style={{ marginBottom: 8 }}>Sources</div>
        <p style={{ fontSize: 11.5, color: MUTED, lineHeight: 1.7, margin: 0 }}>
          USAFacts, state NSLP participation change FY2020–FY2024 · Food Research and Action Center, "The State of Healthy School Meals for All," 2024 · USDA Economic Research Service, "State Universal Free School Meal Policies Reduced Food Insufficiency," 2024 · Congressional Research Service, "School Lunch and Breakfast Participation," 2025 · Glantz et al., 1994, national parent survey on FRPM non-participation · PMC, "Universal School Meal Policies and Perceived Stigma," 2025.
        </p>
        <p style={{ fontSize: 11.5, color: MUTED, marginTop: 14, lineHeight: 1.6 }}>
          Prototype status: this is case study one of a planned series. Next up: financial literacy programs for women in low-income countries.
        </p>
        <p style={{ fontSize: 11.5, color: MUTED, marginTop: 8, lineHeight: 1.6 }}>
          Data last refreshed: July 6, 2026. Your severity-score weighting is saved in this browser and will still be here next time you open it on this device.
        </p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<SchoolMealsGapTracker />);
</script>
</body>
</html>
